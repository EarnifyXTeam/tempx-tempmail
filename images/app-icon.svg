<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="GhostMail">
  <defs>
    <linearGradient id="cyber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="60%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
    <filter id="neon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00F0FF" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Dark circular background with subtle cyber border -->
  <rect width="64" height="64" rx="16" fill="#06070B"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.3"/>
  
