  <rect x="36.5" y="25" width="4.5" height="7" rx="2.2" fill="#06070B"/>
  <circle cx="25.2" cy="27.5" r="1.2" fill="#00F0FF"/>
  <circle cx="38.7" cy="27.5" r="1.2" fill="#00F0FF"/>
